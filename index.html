<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f0f2f5;
        }

        .container{
            width:900px;
            height:500px;
            display:flex;
            background:white;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 0 20px rgba(0,0,0,0.2);
        }

        .left{
            width:50%;
        }

        .left img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .right{
            width:50%;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        form{
            width:80%;
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        input[type="email"],
        input[type="password"]{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
        }

        .remember{
            margin:15px 0;
        }

        button{
            width:100%;
            padding:12px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="left">
        <div class="left">
    <img src="https://images.unsplash.com/photo-1516321497487-e288fb19713f?w=1200&q=80" alt="Premium">
</div>
    </div>

    <div class="right">
        <form>
            <h2>Login Form</h2>

            <input type="email" placeholder="Enter Email" required>

            <input type="password" placeholder="Enter Password" required>

            <div class="remember">
                <input type="checkbox" id="remember">
                <label for="remember">Remember Me</label>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>

</div>

</body>
</html>
